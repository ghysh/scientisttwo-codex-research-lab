[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scientisttwo-codex"
version = "0.1.0"
description = "Codex App research workflow scaffold inspired by ScientistTwo"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
st2 = "scientisttwo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
